<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schatzjagd zur Mittelschule Trofaiach</title>
<style>
  :root {
    --ink: #0b2540;
    --sea-top: #27c4d8;
    --sea-bot: #0b5f8a;
    --sand: #ffe9a8;
    --sun: #ffc93c;
    --coral: #ff6b57;
    --leaf: #3ecf8e;
    --grape: #7a4dff;
    --orange: #ff9a3d;
    --blue: #2f7df6;
    --white: #ffffff;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background-color: var(--sea-bot);
    background-image: linear-gradient(180deg, var(--sea-top) 0%, var(--sea-bot) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Trebuchet MS", "Arial Rounded MT Bold", ui-rounded, "Segoe UI", system-ui, sans-serif;
    font-size: 18px;
    line-height: 1.35;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }

  .app { max-width: 1100px; margin: 0 auto; padding: 12px 14px 30px; }

  /* ---------- HUD ---------- */
  .hud {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: #fff; border: 4px solid var(--ink); border-radius: 20px; padding: 6px 14px;
    box-shadow: 0 5px 0 var(--ink); margin-bottom: 14px; font-weight: 900;
  }
  .hud .brand { font-size: 18px; white-space: nowrap; }
  .pieces { display: flex; gap: 6px; font-size: 26px; }
  .pieces span { filter: grayscale(1) opacity(.3); transition: filter .3s; }
  .pieces span.got { filter: none; animation: pop .5s; }
  .hud-r { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .hud-r button { border: 3px solid var(--ink); background: var(--sand); border-radius: 50%; width: 42px; height: 42px; font-size: 19px; padding: 0; }

  /* ---------- Bausteine ---------- */
  .card {
    background: #fff; border: 4px solid var(--ink); border-radius: 26px;
    box-shadow: 0 8px 0 var(--ink); padding: 22px;
  }
  .btn {
    border: 4px solid var(--ink); background: var(--sun); color: var(--ink);
    border-radius: 20px; padding: 12px 24px; font-weight: 900; font-size: 22px;
    box-shadow: 0 6px 0 var(--ink); transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
  .btn.xl { font-size: 28px; padding: 16px 34px; }
  .btn.ghost { background: #fff; font-size: 18px; padding: 10px 18px; }
  .btn:disabled { background: #cfd8e3; cursor: default; }
  .pill { background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 4px 14px; font-weight: 900; white-space: nowrap; }

  .sthead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .parrot { font-size: 54px; line-height: 1; animation: bob 2.6s ease-in-out infinite; }
  .say {
    position: relative; flex: 1; background: #fff; border: 4px solid var(--ink); border-radius: 20px;
    padding: 10px 16px; font-weight: 800; font-size: 19px; min-height: 58px; display: flex; align-items: center;
  }
  .say::before {
    content: ""; position: absolute; left: -16px; top: 50%; margin-top: -11px;
    border: 11px solid transparent; border-right-color: var(--ink); border-left: 0;
  }
  .stwrap { max-width: 920px; margin: 0 auto; }

  .intro, .outro { text-align: center; max-width: 560px; margin: 20px auto; }
  .big-icon { font-size: 84px; line-height: 1; animation: bob 2.4s ease-in-out infinite; }
  .intro h2, .outro h2 { margin: 6px 0 8px; font-size: 32px; line-height: 1.1; }
  .task { font-size: 22px; font-weight: 800; margin: 0 0 20px; }
  .learn { font-size: 18px; background: #eafaf2; border: 3px solid var(--leaf); border-radius: 16px; padding: 10px 14px; margin: 12px 0 20px; }
  .stars-big { font-size: 56px; letter-spacing: 6px; color: var(--sun); text-shadow: 0 3px 0 var(--ink); }
  .stars-big span { display: inline-block; animation: pop .6s backwards; }
  .stars-big .off { color: #cfd8e3; }
  .piece { font-size: 22px; font-weight: 900; margin: 6px 0; }

  .meter-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .timebar { flex: 1; height: 22px; border: 4px solid var(--ink); border-radius: 14px; background: #fff; overflow: hidden; }
  .timebar i { display: block; height: 100%; width: 100%; background: var(--leaf); transition: width .12s linear; }

  /* ---------- Karte ---------- */
  .map {
    position: relative; width: min(100%, calc((100vh - 190px) * 1.6)); min-width: 300px; margin: 0 auto;
    aspect-ratio: 8 / 5; border: 4px solid var(--ink); border-radius: 28px; box-shadow: 0 8px 0 var(--ink);
    background: linear-gradient(180deg, #7fe3ee, #3fb7d6); overflow: hidden;
  }
  .map svg.deco { position: absolute; inset: 0; width: 100%; height: 100%; }
  .island {
    position: absolute; width: 12.5%; aspect-ratio: 1; transform: translate(-50%, -50%);
    border-radius: 50%; border: 4px solid var(--ink); background: var(--sand);
    display: grid; place-items: center; font-size: clamp(22px, 4.4vw, 48px); padding: 0;
    box-shadow: 0 5px 0 var(--ink);
  }
  .island.locked { filter: grayscale(1); opacity: .6; cursor: default; }
  .island.done { background: #b8f2cf; }
  .island.current { animation: wiggle 1.1s ease-in-out infinite; background: var(--sun); z-index: 3; }
  .island .num {
    position: absolute; top: -8px; left: -8px; width: 28px; height: 28px; border-radius: 50%;
    background: var(--coral); color: #fff; border: 3px solid var(--ink); font-size: 15px; font-weight: 900;
    display: grid; place-items: center;
  }
  .island.done .num { background: var(--leaf); }
  .island .lab {
    position: absolute; top: 100%; margin-top: 6px; left: 50%; transform: translateX(-50%);
    background: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 1px 8px;
    font-size: clamp(10px, 1.55vw, 16px); font-weight: 900; white-space: nowrap;
  }
  .island .st { position: absolute; bottom: -4px; font-size: clamp(10px, 1.6vw, 17px); color: var(--sun); text-shadow: 0 1.5px 0 var(--ink), 0 -1px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink); }
  .island.school { width: 17%; background: #fff3c4; font-size: clamp(30px, 6.5vw, 70px); }
  .island.school.ready { animation: wiggle 1s ease-in-out infinite; background: var(--sun); box-shadow: 0 0 0 8px #fff8, 0 5px 0 var(--ink); }
  .ship { position: absolute; transform: translate(-50%, -135%); font-size: clamp(26px, 5vw, 52px); transition: left 1.1s ease-in-out, top 1.1s ease-in-out; z-index: 4; pointer-events: none; }

  /* ---------- Titel ---------- */
  .title { text-align: center; padding: 30px 8px; }
  .title .parrot { font-size: 110px; }
  .title h1 {
    margin: 4px 0 6px; font-size: clamp(52px, 11vw, 112px); line-height: .95; letter-spacing: -.02em; color: #fff;
    text-shadow: 0 6px 0 var(--ink), 4px 0 0 var(--ink), -4px 0 0 var(--ink), 0 -4px 0 var(--ink);
  }
  .title .sub { color: #fff; font-size: clamp(20px, 3.5vw, 30px); font-weight: 900; text-shadow: 0 3px 0 var(--ink); margin: 0 0 26px; }
  .title .sub b { color: var(--sun); }

  /* ---------- Station 1: Passwort ---------- */
  .zone { min-height: 150px; display: grid; place-items: center; margin-bottom: 14px; }
  .pwcard {
    background: #fff; border: 5px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink);
    padding: 22px 30px; font-family: "Courier New", monospace; font-size: clamp(24px, 5vw, 40px); font-weight: 900;
    cursor: grab; animation: pop .3s; touch-action: none; max-width: 100%; word-break: break-all; text-align: center;
  }
  .pwcard.dragging { cursor: grabbing; z-index: 100; position: relative; box-shadow: 0 16px 0 rgba(11,37,64,.4); }
  .bins { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .bin {
    border: 5px dashed var(--ink); border-radius: 24px; padding: 18px 8px; text-align: center; font-size: 22px; font-weight: 900;
    transition: transform .12s, background .12s; background: #fff;
  }
  .bin span { display: block; font-size: 52px; line-height: 1.1; }
  .bin.bad { background: #ffd9d4; }
  .bin.good { background: #c9f5de; }
  .bin.hot { transform: scale(1.06); border-style: solid; background: var(--sun); }
  .bin.flash-ok { animation: pop .35s; border-color: var(--leaf); }
  .bin.flash-no { animation: shake .3s; border-color: var(--coral); }

  /* ---------- Station 2: Datenpiraten ---------- */
  .field {
    position: relative; height: clamp(300px, 54vh, 520px); border: 4px solid var(--ink); border-radius: 24px; overflow: hidden;
    background: linear-gradient(180deg, #1d2d6b, #3a1c71); touch-action: manipulation;
  }
  .field.hurt { animation: shake .3s; box-shadow: inset 0 0 0 8px var(--coral); }
  .field .safe { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); font-size: 60px; z-index: 1; }
  .field .hud2 { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 8px; z-index: 5; }
  .fall {
    position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 8px; z-index: 3;
    background: #fff; border: 4px solid var(--ink); border-radius: 18px; padding: 6px 14px 6px 10px;
    font-weight: 900; font-size: 20px; white-space: nowrap; cursor: pointer; box-shadow: 0 4px 0 var(--ink);
    will-change: transform;
  }
  .fall .e { font-size: 34px; line-height: 1; }

  /* ---------- Station 3: Binär ---------- */
  .dots { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
  .dots i { width: 22px; height: 22px; border-radius: 50%; border: 4px solid var(--ink); background: #fff; }
  .dots i.on { background: var(--leaf); }
  .dots i.now { background: var(--sun); }
  .goal { text-align: center; font-size: clamp(24px, 5vw, 38px); font-weight: 900; margin-bottom: 14px; }
  .goal b { display: inline-block; background: var(--ink); color: var(--sun); border-radius: 16px; padding: 0 16px; }
  .lamps { display: flex; justify-content: center; gap: clamp(10px, 3vw, 28px); margin-bottom: 14px; }
  .lamp {
    background: #eaf3ff; border: 4px solid var(--ink); border-radius: 22px; padding: 10px 6px 8px;
    width: clamp(70px, 18vw, 120px); display: flex; flex-direction: column; align-items: center; gap: 6px;
    box-shadow: 0 6px 0 var(--ink); font-weight: 900; transition: transform .08s;
  }
  .lamp:active { transform: translateY(4px); }
  .lamp .vnum { font-size: 22px; }
  .lamp .bulb {
    width: clamp(46px, 11vw, 78px); aspect-ratio: 1; border-radius: 50%; border: 4px solid var(--ink); background: #4a5875; transition: all .15s;
  }
  .lamp.on { background: #fff6c8; }
  .lamp.on .bulb { background: #ffe14d; box-shadow: 0 0 26px 10px #ffe14dbb; }
  .lamp .bit { font-family: "Courier New", monospace; font-size: 30px; }
  .lamp.hint { animation: wiggle .5s 3; }
  .readout { text-align: center; font-size: 40px; font-weight: 900; margin-bottom: 8px; }
  .readout b { color: var(--blue); }
  .center-row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; min-height: 64px; }

  /* ---------- Station 4: Memory ---------- */
  .mgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 760px; margin: 0 auto; }
  @media (max-width: 560px) { .mgrid { grid-template-columns: repeat(3, 1fr); } }
  .mcard { aspect-ratio: 1 / .92; padding: 0; border: 0; background: none; perspective: 700px; }
  .mcard .in { position: relative; width: 100%; height: 100%; transition: transform .4s; transform-style: preserve-3d; }
  .mcard.open .in { transform: rotateY(180deg); }
  .mcard .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border: 4px solid var(--ink); border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 5px 0 var(--ink); font-weight: 900;
  }
  .mcard .front { background: var(--grape); color: #fff; font-size: clamp(30px, 6vw, 54px); }
  .mcard .back { background: #fff; transform: rotateY(180deg); font-size: clamp(34px, 7vw, 62px); text-align: center; }
  .mcard .back small { font-size: clamp(13px, 2.6vw, 20px); }
  .mcard .back em { font-style: normal; font-size: clamp(10px, 1.8vw, 14px); background: var(--ink); color: #fff; border-radius: 8px; padding: 0 6px; margin-top: 2px; }
  .mcard.match .back { background: #c9f5de; }
  .mcard.match .in { animation: pop .5s; }

  /* ---------- Station 5: Roboter ---------- */
  .botgame { display: grid; gap: 16px; }
  @media (min-width: 780px) { .botgame { grid-template-columns: minmax(300px, 420px) 1fr; align-items: start; } }
  .rgrid {
    position: relative; width: min(100%, 440px, 52vh); min-width: 260px; aspect-ratio: 1; margin: 0 auto;
    display: grid; grid-template-columns: repeat(var(--n, 5), 1fr); border: 5px solid var(--ink); border-radius: 18px; overflow: hidden;
    box-shadow: 0 8px 0 var(--ink);
  }
  .cell { background: #ffe9a8; display: grid; place-items: center; }
  .cell.alt { background: #f7d98a; }
  .cell svg { width: 86%; height: 86%; }
  .robot { position: absolute; left: 0; top: 0; width: 20%; height: 20%; display: grid; place-items: center; transition: transform .45s ease; z-index: 5; }
  .robot .ico { position: relative; z-index: 2; }
  .robot.bump { animation: shake .3s; }
  .lvl { text-align: center; font-weight: 900; margin: 0 0 8px; }
  .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .blk {
    flex: 1; border: 4px solid var(--ink); border-radius: 18px; color: #fff; font-weight: 900; font-size: 20px; padding: 8px 4px;
    box-shadow: 0 5px 0 var(--ink); touch-action: none; display: flex; flex-direction: column; align-items: center; line-height: 1.1;
    text-shadow: 0 2px 0 rgba(0,0,0,.25);
  }
  .blk .gl { font-size: 40px; font-weight: 900; line-height: 1; }
  .blk.dragging { z-index: 100; position: relative; }
  .blk[data-c="U"] { background: var(--blue); }
  .blk[data-c="D"] { background: #17a398; }
  .blk[data-c="L"] { background: var(--orange); }
  .blk[data-c="R"] { background: var(--grape); }
  .track { display: flex; flex-wrap: wrap; gap: 8px; background: #fff; border: 4px solid var(--ink); border-radius: 18px; padding: 10px; min-height: 90px; margin-bottom: 12px; }
  .slot { width: 54px; height: 54px; border: 3px dashed #9db2c9; border-radius: 12px; display: grid; place-items: center; }
  .slot .blk { width: 100%; height: 100%; padding: 0; border-width: 3px; border-radius: 10px; box-shadow: none; font-size: 28px; justify-content: center; flex: none; }
  .slot .blk.run { outline: 5px solid var(--sun); transform: scale(1.12); }
  .ctrls { display: flex; flex-wrap: wrap; gap: 10px; }

  /* ---------- Finale ---------- */
  .chestwrap { text-align: center; padding: 10px; }
  .chestwrap h2 { color: #fff; font-size: clamp(28px, 5vw, 44px); text-shadow: 0 4px 0 var(--ink); margin: 0 0 6px; }
  .chestbtn { background: none; border: 0; padding: 0; position: relative; width: min(340px, 80vw); }
  .chest { width: 100%; height: auto; overflow: visible; }
  .chest .lid { transform-box: view-box; transform-origin: 20px 70px; transition: transform .6s cubic-bezier(.3,1.6,.5,1); }
  .chest .glow { opacity: 0; transition: opacity .5s; }
  .chestbtn.open .lid { transform: rotate(-62deg); }
  .chestbtn.open .glow { opacity: .95; }
  .chestbtn.shake { animation: shake .12s 6; }
  .chestbtn:not(.open):not(.shake) { animation: wiggle 1.2s ease-in-out infinite; }
  .school-scene { max-width: 640px; margin: 0 auto; text-align: center; }
  .school-scene svg { width: 100%; height: auto; border: 4px solid var(--ink); border-radius: 24px; box-shadow: 0 8px 0 var(--ink); background: #9be7ff; display: block; animation: pop .6s; }
  .logo-card { background: #fff; border: 4px solid var(--ink); border-radius: 24px; box-shadow: 0 8px 0 var(--ink); padding: 14px 22px; margin: 22px auto 14px; max-width: 400px; animation: pop .6s .3s backwards; }
  .logo-card img { display: block; width: 100%; height: auto; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .cert .logo { display: block; width: min(250px, 70%); height: auto; margin: 0 auto 10px; }
  .school-scene h2 { color: #fff; font-size: clamp(30px, 6vw, 52px); text-shadow: 0 4px 0 var(--ink); margin: 18px 0 6px; line-height: 1.05; }
  .school-scene p { color: #fff; font-weight: 800; font-size: 22px; text-shadow: 0 2px 0 var(--ink); margin: 0 0 18px; }

  .certwrap { max-width: 720px; margin: 0 auto; }
  .cert {
    background: #fff9e0; border: 6px double var(--ink); border-radius: 18px; padding: 28px 22px; text-align: center;
    box-shadow: 0 8px 0 var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .cert h2 { margin: 0 0 6px; font-size: clamp(28px, 5.5vw, 46px); line-height: 1; }
  .cert .nm { font-size: clamp(30px, 6vw, 52px); font-weight: 900; color: var(--grape); margin: 8px 0; min-height: 1.2em; word-break: break-word; }
  .cert .stars-big { font-size: 40px; }
  .cert p { margin: 6px 0; font-weight: 700; }
  .cert .reward { margin-top: 14px; background: var(--sun); border: 3px solid var(--ink); border-radius: 14px; padding: 8px 12px; font-weight: 900; }
  .namerow { display: flex; gap: 10px; margin: 16px 0; flex-wrap: wrap; }
  .namerow input {
    flex: 1 1 220px; font: inherit; font-size: 24px; font-weight: 900; padding: 10px 14px; border: 4px solid var(--ink); border-radius: 16px;
    -webkit-user-select: text; user-select: text;
  }
  .pdfmsg { text-align: center; font-weight: 800; color: #fff; text-shadow: 0 2px 0 var(--ink); min-height: 1.4em; margin: 6px 0; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 300; }

  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes wiggle { 0%,100% { transform: translate(-50%,-50%) rotate(-4deg) scale(1.04); } 50% { transform: translate(-50%,-50%) rotate(4deg) scale(1.1); } }
  @keyframes shake { 0%,100% { translate: 0 0; } 25% { translate: -7px 0; } 75% { translate: 7px 0; } }
  .lamp.hint { animation: lampwiggle .5s 3; }
  @keyframes lampwiggle { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) scale(1.06); } }
  .chestbtn:not(.open):not(.shake) { animation-name: chestwig; }
  @keyframes chestwig { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg) scale(1.04); } }

  @media (prefers-reduced-motion: reduce) {
    .parrot, .big-icon, .island.current, .island.school.ready, .chestbtn:not(.open):not(.shake) { animation: none; }
  }
  @media print {
    body { background: #fff !important; }
    .hud, .actions, .namerow, .sthead, #confetti, .noprint { display: none !important; }
    .cert { box-shadow: none; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="hud" id="hud" hidden>
    <div class="brand">🏴‍☠️ Schatzjagd</div>
    <div class="pieces" id="pieces"></div>
    <div class="hud-r"><span class="pill" id="starsum">⭐ 0</span><button id="snd" aria-label="Ton an oder aus">🔊</button></div>
  </div>
  <main id="screen"></main>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(function () {
  'use strict';

  /* ============ Hier könnt ihr Texte anpassen ============ */
  var CONFIG = {
    school: 'Mittelschule Trofaiach',
    schoolShort: 'MS Trofaiach',
    schoolText: 'Der größte Schatz ist eine Schule voller Computer, Roboter und neuer Freunde!',

  /* ============ Station 1: Passwort-Tresor ============ */
  function st1(i) {
    var WEAK = [
      ['123456', 'Diese Zahlen probiert ein Computer als Allererstes!'],
      ['hallo', 'Ein einfaches Wort ist blitzschnell erraten.'],
      ['Lena2014', 'Name plus Geburtsjahr? Das raten Fremde leicht.'],

    var STRONG = [
      ['Bl4uer!Elefant#42', 'Lang, bunt gemischt und lustig. Stark!'],
      ['Pizza-Mond-Tanzt-7!', 'Ein verrückter Satz ist lang und leicht zu merken.'],
      ['xK9#mPq2$Lw', 'Wild gemischt aus Buchstaben, Zahlen und Zeichen.'],

      shuffle(WEAK.slice()).slice(0, 4).map(function (c) { return { t: c[0], why: c[1], strong: false }; })
        .concat(shuffle(STRONG.slice()).slice(0, 4).map(function (c) { return { t: c[0], why: c[1], strong: true }; }))
    );

        '<div class="zone" id="zone"></div>' +
        '<div class="bins">' +
        '<div class="bin bad" data-bin="weak"><span>🗑️</span>Zu schwach</div>' +
        '<div class="bin good" data-bin="strong"><span>🔐</span>Starker Tresor</div></div>'));
    say('Ist das Passwort stark oder schwach? Zieh die Karte in den richtigen Behälter!');

    var bins = Array.prototype.slice.call(document.querySelectorAll('.bin'));

    function nextCard() {
      if (ended) return;

      $('zone').innerHTML = ''; $('zone').appendChild(d);

        targets: '.bin',
        onDrop: function (n, t) { judge(n, t); return true; },
        onMove: function (e) {
          bins.forEach(function (b) {
            if (!e) { b.classList.remove('hot'); return; }
            var r = b.getBoundingClientRect();
            b.classList.toggle('hot', e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom);
          });
        }
      });
    }

    function judge(node, binEl) {
      if (ended || !cardEl) return;
      var c = cards[idx];
      var choseStrong = binEl.dataset.bin === 'strong';
      var ok = choseStrong === c.strong;
      cardEl = null;
      if (ok) { correct++; sfx.good(); } else { sfx.bad(); }
      binEl.classList.remove('flash-ok', 'flash-no');
      void binEl.offsetWidth;
      binEl.classList.add(ok ? 'flash-ok' : 'flash-no');
      say((ok ? '✅ Richtig! ' : '❌ Leider falsch. ') + c.why);
      $('sc').textContent = '✔ ' + correct + ' / ' + cards.length;
      idx++;

    }

    var kh = function (e) {
      if (!cardEl) return;
      var b = e.key === 'ArrowLeft' ? 'weak' : (e.key === 'ArrowRight' ? 'strong' : null);
      if (b) judge(cardEl, document.querySelector('.bin[data-bin="' + b + '"]'));
    };
    document.addEventListener('keydown', kh);

      var left = Math.max(0, 1 - (Date.now() - t0) / 1000 / TOTAL);
      var tb = $('tb'); if (tb) { tb.style.width = (left * 100) + '%'; tb.style.background = left < 0.25 ? 'var(--coral)' : 'var(--leaf)'; }
      if (left <= 0) finish();

    function finish() {

  /* ============ Station 2: Datenpiraten ============ */
  function st2(i) {
    var PRIV = [['🏠', 'Meine Adresse'], ['📱', 'Handynummer'], ['🔑', 'Passwort'], ['🎂', 'Geburtsdatum'], ['🪪', 'Ausweis'], ['📍', 'Wo ich gerade bin'], ['📧', 'E-Mail-Adresse'], ['💳', 'Bankkarte'], ['👤', 'Mein voller Name'], ['🔢', 'Meine PIN']];
    var OKAY = [['🎨', 'Lieblingsfarbe'], ['🍕', 'Lieblingsessen'], ['🐶', 'Lieblingstier'], ['🎵', 'Lieblingslied'], ['🦸', 'Lieblingsheld'], ['🏀', 'Lieblingssport'], ['📚', 'Lieblingsbuch'], ['🎮', 'Lieblingsspiel'], ['🍦', 'Lieblingseis'], ['🌈', 'Lieblingsfach']];
    var decks = { p: [], o: [] }, lastDrawn = { p: '', o: '' };
    var GOAL = 5;
    var caught = 0, mistakes = 0, spawnIn = 0.4, items = [], ended = false, last = performance.now(), okRun = 0;

    var my = view('game',
      gameShell(i,
        '<div class="field" id="field">' +
        '<div class="hud2"><span class="pill" id="sc"></span><span class="pill" id="mi">💥 0</span></div>' +
        '<div class="safe">🧰</div></div>'));
    say('Fang 5 geheime Sachen, bevor die Piraten sie klauen! Harmloses lässt du einfach fallen.');
    var field = $('field');

    function hud() {
      var s = ''; for (var k = 0; k < GOAL; k++) s += k < caught ? '🔒' : '⚪';
      $('sc').textContent = s; $('mi').textContent = '💥 ' + mistakes;
    }
    function hurt() { field.classList.remove('hurt'); void field.offsetWidth; field.classList.add('hurt'); }

    // Jeder Begriff kommt erst wieder, wenn alle anderen dran waren
    function draw(priv) {
      var key = priv ? 'p' : 'o', pool = priv ? PRIV : OKAY;
      if (!decks[key].length) {
        var onScreen = items.map(function (x) { return x.label; });
        var fresh = pool.filter(function (q) { return onScreen.indexOf(q[1]) === -1; });
        if (!fresh.length) fresh = pool.slice();
        decks[key] = shuffle(fresh);
        var top = decks[key].length - 1;
        if (top > 0 && decks[key][top][1] === lastDrawn[key]) { var t = decks[key][top]; decks[key][top] = decks[key][0]; decks[key][0] = t; }
      }
      var pick = decks[key].pop();
      lastDrawn[key] = pick[1];
      return pick;
    }

    function spawn() {
      var priv = okRun >= 2 ? true : Math.random() < 0.5;
      okRun = priv ? 0 : okRun + 1;
      var d = draw(priv);
      var el = document.createElement('div');
      el.className = 'fall';
      el.innerHTML = '<span class="e">' + d[0] + '</span>' + d[1];
      field.appendChild(el);
      var w = el.offsetWidth, fw = field.clientWidth;
      var it = { el: el, x: Math.random() * Math.max(10, fw - w - 10) + 5, y: 44, priv: priv, label: d[1], dead: false };
      el.style.transform = 'translate(' + it.x + 'px,' + it.y + 'px)';
      el.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        if (it.dead || ended) return;
        it.dead = true;
        items.splice(items.indexOf(it), 1);
        if (it.priv) {
          caught++; sfx.good(); hud();
          say(caught >= GOAL ? 'Alle 5 gerettet! 🎉' : ['Gesichert! 🔒', 'Stark! Das bleibt geheim!', 'Super gefangen!'][(Math.random() * 3) | 0] + ' Noch ' + (GOAL - caught) + '.');
          el.style.transition = 'transform .3s ease-in, opacity .3s';
          el.style.transform = 'translate(' + (fw / 2 - w / 2) + 'px,' + (field.clientHeight - 70) + 'px) scale(.3)';
          el.style.opacity = '0';
        } else {
          mistakes++; hud(); hurt(); sfx.bad();
          say('Autsch! „' + it.label + '“ darfst du ruhig verraten.');
          el.style.transition = 'transform .25s, opacity .25s';
          el.style.opacity = '0';
        }
        setTimeout(function () { el.remove(); }, 320);
        if (caught >= GOAL) finish();
      });
      items.push(it);
    }

    function loop(now) {
      if (my !== TOKEN || ended) return;
      var dt = Math.min(0.05, (now - last) / 1000); last = now;
      spawnIn -= dt;
      if (spawnIn <= 0) { spawn(); spawnIn = 1.55; }
      var speed = 58 + caught * 7, fh = field.clientHeight;
      for (var k = items.length - 1; k >= 0; k--) {
        var it = items[k];
        it.y += speed * dt;
        it.el.style.transform = 'translate(' + it.x + 'px,' + it.y + 'px)';
        if (it.y > fh - 44) {
          items.splice(k, 1); it.dead = true;
          it.el.remove();
          if (it.priv) {
            mistakes++; hud(); hurt(); sfx.bad();
            say('Ein Pirat hat „' + it.label + '“ geklaut! Gleich kommt die nächste Chance.');
          }
        }
      }
      requestAnimationFrame(loop);
    }

    function finish() {
      if (ended) return; ended = true;
      items.forEach(function (it) { it.el.remove(); }); items = [];
      var stars = mistakes <= 2 ? 3 : (mistakes <= 5 ? 2 : 1);
      later(function () { endStation(i, stars); }, 1000);
    }
    hud();
    requestAnimationFrame(function (t) { last = t; requestAnimationFrame(loop); });
  }

  /* ============ Station 3: Binär-Safe ============ */
  function st3(i) {
    var rounds = [{ t: 5 }, { t: 9 }, { t: 13 }, { age: true }];
    var r = 0, bits = [0, 0, 0, 0], locked = false, t0 = Date.now(), hintTimer = null;
    var VAL = [8, 4, 2, 1];

    var lamps = '';
    VAL.forEach(function (v, k) {
      lamps += '<button class="lamp" data-k="' + k + '" aria-label="Lampe ' + v + '"><span class="vnum">' + v + '</span><span class="bulb"></span><span class="bit">0</span></button>';
    });
    view('game', gameShell(i,
      '<div class="card">' +
      '<div class="dots" id="dots"></div>' +
      '<div class="goal" id="goal"></div>' +
      '<div class="lamps" id="lamps">' + lamps + '</div>' +
      '<div class="readout">= <b id="val">0</b></div>' +
      '<div class="center-row"><button class="btn" id="ok" hidden>Das bin ich!</button><button class="btn ghost" id="hint" hidden>Tipp 💡</button></div></div>'));
    var lampEls = Array.prototype.slice.call(document.querySelectorAll('.lamp'));

    function value() { return bits.reduce(function (a, b, k) { return a + b * VAL[k]; }, 0); }
    function draw() {
      var d = ''; for (var k = 0; k < 4; k++) d += '<i class="' + (k < r ? 'on' : (k === r ? 'now' : '')) + '"></i>';
      $('dots').innerHTML = d;
      lampEls.forEach(function (l, k) { l.classList.toggle('on', !!bits[k]); l.querySelector('.bit').textContent = bits[k]; });
      $('val').textContent = value();
    }
    function startRound() {
      bits = [0, 0, 0, 0]; locked = false;
      var rd = rounds[r];
      $('goal').innerHTML = rd.age ? 'Wie alt bist du? <b>Stell dein Alter ein!</b>' : 'Mach die Zahl <b>' + rd.t + '</b>!';
      say(r === 0 ? 'Tippe auf die Lampen! Jede Lampe ist ein Wert. Leuchtet sie, zählt er mit.' : (rd.age ? 'Letzte Runde! Jetzt wird es persönlich.' : 'Noch eine!'));
      $('ok').hidden = true; $('hint').hidden = true;
      clearTimeout(hintTimer);
      if (!rd.age) hintTimer = later(function () { $('hint').hidden = false; }, 14000);
      draw();
    }
    function roundDone(txt, delay, last) {
      locked = true; sfx.good();
      say(txt);
      $('ok').hidden = true; $('hint').hidden = true;
      later(function () {
        if (last) {
          var sec = (Date.now() - t0) / 1000;
          endStation(i, sec < 50 ? 3 : (sec < 90 ? 2 : 1));
        } else { r++; startRound(); }
      }, delay);
    }
    lampEls.forEach(function (l, k) {
      l.addEventListener('click', function () {
        if (locked) return;
        bits[k] = bits[k] ? 0 : 1; sfx.flip(); draw();

  var HW = [

  var BASEOF = { 0xC4: 'A', 0xD6: 'O', 0xDC: 'U', 0xE4: 'a', 0xF6: 'o', 0xFC: 'u' };
  function pdfClean(str) {
    var out = '';
    for (var ch of String(str)) {
      var cp = ch.codePointAt(0);
      if ((cp >= 32 && cp <= 126) || (cp >= 0xA0 && cp <= 0xFF)) out += ch;
    }
    return out;
  }
  function pdfW(str, size, bold) {
    var t = HW[bold ? 1 : 0], w = 0;
    for (var k = 0; k < str.length; k++) {
      var c = str.charCodeAt(k);
      if (BASEOF[c]) c = BASEOF[c].charCodeAt(0);
      w += (c >= 32 && c <= 126) ? t[c - 32] : (c === 0xDF ? 611 : 556);
    }
    return w * size / 1000;
  }
  function pdfEsc(str) {
    var o = '';
    for (var k = 0; k < str.length; k++) {
      var c = str.charCodeAt(k);
      if (c === 40 || c === 41 || c === 92) o += '\\' + str[k];
      else if (c > 126) o += '\\' + ('00' + c.toString(8)).slice(-3);

    return o;
  }

    words.forEach(function (w) {
      var t = cur ? cur + ' ' + w : w;
      if (pdfW(t, size, bold) <= maxW || !cur) cur = t; else { lines.push(cur); cur = w; }
    });

  }

  function f2(n) { return (Math.round(n * 100) / 100).toString(); }

  function buildCertPdf(name, starsEarned, totalStarCount, dateStr) {
    var PW = 595.28, PH = 841.89, c = '';
    var NAVY = '0.043 0.145 0.251', GOLD = '1 0.788 0.235', GRAPE = '0.478 0.302 1', GREY = '0.45 0.45 0.45';
    function text(str, size, bold, y, color, x) {

      c += 'BT ' + color + ' rg /' + (bold ? 'F2' : 'F1') + ' ' + size + ' Tf ' + f2(px) + ' ' + f2(y) + ' Td (' + pdfEsc(str) + ') Tj ET\n';

      pts.forEach(function (p, k) { c += f2(p[0]) + ' ' + f2(p[1]) + (k ? ' l\n' : ' m\n'); });

    // Titel
    text('Schatzmeister-Urkunde', 34, true, 590, NAVY);

    lines.forEach(function (ln, k) { text(ln, 15, true, by + bh - 28 - k * 20, NAVY); });
    text(dateStr, 11, false, 62, GREY);

    // Zusammenbauen
    var jpg = b64bytes(CONFIG.logoJpg), chunks = [], offs = [], len = 0;
    function put(x) {
      var u;
      if (typeof x === 'string') { u = new Uint8Array(x.length); for (var k = 0; k < x.length; k++) u[k] = x.charCodeAt(k) & 255; }

    obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
    obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + PW + ' ' + PH + '] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> /XObject << /Im1 7 0 R >> >> /Contents 4 0 R >>');
    obj(4, '<< /Length ' + c.length + ' >>\nstream\n' + c + 'endstream');
    obj(5, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    obj(6, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    offs[7] = len;
    put('7 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + LOGO_W + ' /Height ' + LOGO_H + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpg.length + ' >>\nstream\n');

    chunks.forEach(function (u) { all.set(u, p); p += u.length; });

  }

  async function savePdf(msgEl) {

    var safe = pdfClean(S.name).replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'Schatzmeister';

      if (e && e.code === 'declined') return;
    }
    try {
      var url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
      var a = document.createElement('a');
      a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
      msgEl.textContent = '✔ PDF erstellt. Schau in deinen Downloads nach, dann kannst du es drucken.';
    } catch (e2) {
      msgEl.textContent = 'Das PDF konnte hier nicht gespeichert werden.';
    }
  }

  function randomName() {
    var A = ['Blitz', 'Feuer', 'Pizza', 'Turbo', 'Donner', 'Nebel', 'Super', 'Wilder', 'Glitzer', 'Mega', 'Cooler'];
    var N = ['Papagei', 'Kapitän', 'Pirat', 'Hai', 'Delfin', 'Drache', 'Kraken', 'Ninja', 'Schatzjäger', 'Seebär'];
    return A[(Math.random() * A.length) | 0] + '-' + N[(Math.random() * N.length) | 0];
  }

  function certScene() {
    if (!S.name) S.name = randomName();
    var date = new Date().toLocaleDateString('de-AT');
    view('cert',
      '<div class="certwrap"><div class="cert" id="certcard">' +
      '<img class="logo" src="' + CONFIG.logo + '" alt="Logo ' + CONFIG.school + '">' +
      '<h2>Schatzmeister-Urkunde 🏴‍☠️</h2>' +
      '<p>Hiermit wird ernannt:</p><div class="nm" id="nm"></div>' +
      '<p>Du hast den Schatz der <b>' + CONFIG.school + '</b> gefunden!</p>' +
      '<div class="stars-big">' + starStr(totalStars() >= 13 ? 3 : (totalStars() >= 9 ? 2 : 1)) + '</div>' +
      '<p>' + totalStars() + ' von 15 Sternen</p>' +
      '<p>' + CONFIG.welcome + ' 🎒</p>' +
      '<div class="reward">' + CONFIG.reward + '</div>' +
      '<p style="font-size:15px;margin-top:10px">' + date + '</p></div>' +
      '<div class="namerow"><input id="nmi" maxlength="18" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Dein Piratenname"><button class="btn ghost" id="dice">🎲 Neuer Name</button></div>' +
      '<p class="pdfmsg noprint" id="pdfmsg" aria-live="polite"></p><div class="actions"><button class="btn" id="pdf">📄 PDF speichern</button><button class="btn xl" id="again">🔄 Nächstes Kind</button></div></div>');
    var inp = $('nmi'); inp.value = S.name; $('nm').textContent = S.name;
    inp.addEventListener('input', function () { S.name = inp.value; $('nm').textContent = inp.value || '…'; });
    $('dice').addEventListener('click', function () { S.name = randomName(); inp.value = S.name; $('nm').textContent = S.name; sfx.tap(); });
    $('pdf').addEventListener('click', function () { sfx.tap(); savePdf($('pdfmsg')); });
    (function () {
      var armed = false, tm = null, btn = $('again');
      btn.addEventListener('click', function () {
        sfx.tap();
        if (!armed) {
          armed = true; btn.textContent = 'Sicher? Nochmal tippen';
          tm = setTimeout(function () { armed = false; btn.textContent = '🔄 Nächstes Kind'; }, 3500);
        } else { clearTimeout(tm); resetGame(); }
      });
    })();
    confetti(60);
  }

  titleScreen();
})();
</script>
